# nginx/nginx.conf
events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 requests/second per client IP, state kept in a 10 MB zone
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/s;

    # A/B testing: pick the upstream from the X-Experiment-Group request header.
    # nginx exposes the header as $http_x_experiment_group.
    map $http_x_experiment_group $backend {
        default api_v1;
        debug   api_v2;
    }

    # Load balancing: Docker DNS returns the 3 replica IPs for "api-v1",
    # and nginx round-robins across them.
    upstream api_v1 {
        server api-v1:8000;
    }

    upstream api_v2 {
        server api-v2:8000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS gateway
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Prediction endpoint: basic auth + rate limiting + A/B routing
        location /predict {
            auth_basic           "API Access Protected";
            auth_basic_user_file /etc/nginx/.htpasswd;

            limit_req zone=predict_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://$backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else (/docs, /openapi.json) goes to the same backend
        location / {
            proxy_pass http://$backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Internal-only metrics endpoint for the Prometheus exporter.
    # Port 8080 is NOT published to the host, so only containers on the
    # compose network can reach it.
    server {
        listen 8080;

        location /nginx_status {
            stub_status;
            access_log off;
        }
    }
}